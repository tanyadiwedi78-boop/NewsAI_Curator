name: Daily News Digest

on:
  schedule:
    - cron: '30 3 * * *'   # UTC 3:30 AM = IST 9:00 AM
  workflow_dispatch:          # manual trigger bhi kar sakti ho testing ke liye

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news curator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}       
          SMTP_PORT: ${{ secrets.SMTP_PORT }}              
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python content_curator.py

      - name: Commit new digest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "Daily digest: $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
          